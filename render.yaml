services:
  - type: web
    name: capture-the-narrative
    runtime: node
    plan: standard # 1 CPU / 2GB for the demo burst (starter is 0.5 CPU). Keep 1 instance: state lives in memory.
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/rooms/au
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard
      - key: ADMIN_TOKEN
        generateValue: true
      - key: FAKE_LLM
        value: "0"
      - key: AGENT_COUNT
        value: "1000"
      - key: CONCURRENCY
        value: "1000"
      - key: FEEDBACK_CONCURRENCY
        value: "30"
      - key: REFRESH_MS
        value: "1000"
      - key: DAILY_REQUEST_CAP
        value: "200000"
      - key: DATABASE_URL
        fromDatabase:
          name: ctn-db
          property: connectionString

databases:
  - name: ctn-db
    plan: basic-256mb
